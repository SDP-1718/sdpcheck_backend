services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sdpcheck}
      DB_USERNAME: ${POSTGRES_USER:-sdpcheck}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sdpcheck}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdpcheck}
      POSTGRES_USER: ${POSTGRES_USER:-sdpcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdpcheck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: