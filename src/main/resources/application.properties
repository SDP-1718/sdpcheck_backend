spring.application.name=sdpcheck

# A local .env file is optional and never committed. It uses Java-properties syntax.
spring.config.import=optional:file:.env[.properties]

# Local, test, and prod must be selected explicitly to prevent accidental defaults.
spring.profiles.default=none

# Schema changes are owned by Flyway migrations, never Hibernate auto-update.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true

# Admin notice images are stored in PostgreSQL, with a 5 MiB per-file limit.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT (values are injected from .env locally and from the deployment environment in prod)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

# Kakao Login
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:}

# Frontend redirect destination after Kakao login
auth.frontend-callback-url=${FRONTEND_AUTH_CALLBACK_URL:}

# Exact frontend origins, comma-separated; empty disables cross-origin access.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# OpenAI attendance insight
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:}
